<div [ngClass]="messageClasses()">
  <app-profile [userImg]="displayImage()"></app-profile>

  <div class="message-content-wrapper">
    <p class="message-text" [ngClass]="messageTextClasses()">
      {{ message().content }}
    </p>
    <span class="message-time">
      {{ formattedTimestamp() }}
    </span>
  </div>
</div>
