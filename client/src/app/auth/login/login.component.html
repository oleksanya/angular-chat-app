<form class="login-form" [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <div class="login-field">
    <input
      class="login-input"
      id="email"
      placeholder="Email"
      formControlName="email"
      type="email"
      autocomplete="email"
    />

    @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
      <div class="login-message-error visible">Please enter a valid email.</div>
    }
  </div>

  <div class="login-field">
    <input
      class="login-input"
      id="password"
      placeholder="Password"
      formControlName="password"
      type="password"
      autocomplete="current-password"
    />

    @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
      <div class="login-message-error visible">Password must be at least 4 characters long.</div>
    }
  </div>

  @if (errorMessage()) {
    <div class="login-field">
      <div class="login-message-error visible">
        {{ errorMessage() }}
      </div>
    </div>
  }

  <button class="btn-submit" type="submit" [disabled]="loginForm.invalid || isLoading()">
    @if (!isLoading()) {
      <span>Login</span>
    } @else {
      <span>Logging in...</span>
    }
  </button>
</form>
